<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#140608"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Browser Frame Header -->
  <rect x="30" y="25" width="740" height="430" rx="16" fill="#0b1329" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="25" width="740" height="42" rx="16" fill="#070d1e"/>
  <!-- Browser Dots -->
  <circle cx="55" cy="46" r="5.5" fill="#ef4444"/>
  <circle cx="72" cy="46" r="5.5" fill="#f59e0b"/>
  <circle cx="89" cy="46" r="5.5" fill="#10b981"/>
  <!-- URL Bar -->
  <rect x="180" y="34" width="440" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="500">🔒 https://hyderabad-emergency-ambulance.in</text>

  <!-- Top Emergency Bar inside website -->
  <rect x="30" y="67" width="740" height="34" fill="#7f1d1d"/>
  <circle cx="55" cy="84" r="5" fill="#f87171" filter="url(#glow)"/>
  <text x="70" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#fef2f2" font-weight="700">24/7 CRITICAL EMERGENCY HOTLINE: 15-MINUTE ARRIVAL IN HYDERABAD</text>
  <rect x="660" y="73" width="95" height="22" rx="4" fill="#dc2626"/>
  <text x="707" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">CALL 108 / SOS</text>

  <!-- Website Navbar -->
  <rect x="30" y="101" width="740" height="48" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="60" cy="125" r="14" fill="#ef4444"/>
  <path d="M56 125 h8 M60 121 v8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="84" y="130" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" font-weight="800">SANJEEVANI <tspan fill="#f87171">AMBULANCE</tspan></text>
  
  <text x="440" y="129" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">ICU Ventilator</text>
  <text x="530" y="129" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">Oxygen Support</text>
  <text x="630" y="129" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">Dead Body Freezer</text>

  <!-- Website Hero Section -->
  <g transform="translate(60, 170)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="110" y="16" font-family="'Inter', sans-serif" font-size="10" fill="#fca5a5" font-weight="700" text-anchor="middle">🚨 HYDERABAD FASTEST DISPATCH</text>

    <!-- Main Headline -->
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="24" fill="#ffffff" font-weight="900" letter-spacing="-0.5">
      Emergency ICU & Oxygen
    </text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="24" fill="#ef4444" font-weight="900" letter-spacing="-0.5">
      Ambulance Services 24/7
    </text>

    <text x="0" y="108" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" font-weight="400">
      Fully equipped Advanced Life Support (ALS) & Basic Life Support (BLS)
    </text>
    <text x="0" y="126" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" font-weight="400">
      with certified paramedics across Secunderabad, Banjara Hills, Gachibowli.
    </text>

    <!-- Action Buttons -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="165" height="40" rx="8" fill="url(#redAccent)"/>
      <text x="82" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="800" text-anchor="middle">⚡ CALL DISPATCH NOW</text>

      <rect x="180" y="0" width="160" height="40" rx="8" fill="#10b981"/>
      <text x="260" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="800" text-anchor="middle">💬 WHATSAPP LIVE SOS</text>
    </g>

    <!-- Stat Pills -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="105" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" font-weight="800">12 - 15m</text>
      <text x="12" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Avg Response</text>

      <rect x="115" y="0" width="105" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="127" y="20" font-family="'Inter', sans-serif" font-size="14" fill="#22c55e" font-weight="800">24/7/365</text>
      <text x="127" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Ready On Call</text>

      <rect x="230" y="0" width="115" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="242" y="20" font-family="'Inter', sans-serif" font-size="14" fill="#38bdf8" font-weight="800">GPS Live</text>
      <text x="242" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Track Ambulance</text>
    </g>
  </g>

  <!-- Ambulance Visual Card / Graphic on Right -->
  <g transform="translate(470, 170)">
    <rect x="0" y="0" width="270" height="255" rx="14" fill="url(#cardGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Emergency Beacon Animation Glow -->
    <circle cx="135" cy="50" r="30" fill="#ef4444" opacity="0.25" filter="url(#glow)"/>
    
    <!-- Ambulance Illustration -->
    <!-- Van Body -->
    <rect x="40" y="70" width="180" height="85" rx="10" fill="#ffffff"/>
    <path d="M180 70 L220 100 L220 155 L180 155 Z" fill="#ffffff"/>
    <!-- Windshield -->
    <path d="M182 78 L212 102 L182 102 Z" fill="#38bdf8" opacity="0.85"/>
    <!-- Red Stripe -->
    <rect x="40" y="110" width="180" height="18" fill="#dc2626"/>
    <!-- Medical Cross -->
    <rect x="95" y="85" width="26" height="8" rx="2" fill="#dc2626"/>
    <rect x="104" y="76" width="8" height="26" rx="2" fill="#dc2626"/>
    <text x="135" y="124" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" font-weight="800">AMBULANCE</text>
    <!-- Siren on roof -->
    <rect x="98" y="62" width="18" height="8" rx="3" fill="#ef4444"/>
    <circle cx="107" cy="66" r="3" fill="#ffffff"/>
    <!-- Wheels -->
    <circle cx="85" cy="155" r="16" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <circle cx="85" cy="155" r="6" fill="#cbd5e1"/>
    <circle cx="185" cy="155" r="16" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <circle cx="185" cy="155" r="6" fill="#cbd5e1"/>

    <!-- Service Spec Pills -->
    <g transform="translate(15, 185)">
      <rect x="0" y="0" width="115" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="57" y="16" font-family="'Inter', sans-serif" font-size="9" fill="#f87171" font-weight="700" text-anchor="middle">✓ ICU Ventilator</text>

      <rect x="125" y="0" width="115" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="182" y="16" font-family="'Inter', sans-serif" font-size="9" fill="#4ade80" font-weight="700" text-anchor="middle">✓ Oxygen Cylinder</text>

      <rect x="0" y="30" width="240" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="120" y="46" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8" font-weight="700" text-anchor="middle">✓ Hyderabad To Outstation Transfers</text>
    </g>
  </g>
</svg>
