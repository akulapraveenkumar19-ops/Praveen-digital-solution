<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="travelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#021f1e"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#travelBg)"/>

  <!-- Browser Header -->
  <rect x="30" y="25" width="740" height="430" rx="16" fill="#042120" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="30" y="25" width="740" height="42" rx="16" fill="#021717"/>
  <circle cx="55" cy="46" r="5.5" fill="#ef4444"/>
  <circle cx="72" cy="46" r="5.5" fill="#f59e0b"/>
  <circle cx="89" cy="46" r="5.5" fill="#10b981"/>
  <rect x="180" y="34" width="440" height="24" rx="6" fill="#0f2928" stroke="#134e4a" stroke-width="1"/>
  <text x="400" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#99f6e4" text-anchor="middle" font-weight="500">🔒 https://wanderlust-holidays.com</text>

  <!-- Website Navbar -->
  <rect x="30" y="67" width="740" height="52" fill="#072b2a" stroke="#115e59" stroke-width="1"/>
  <circle cx="65" cy="93" r="14" fill="url(#tealGrad)"/>
  <text x="65" y="98" font-size="14" text-anchor="middle">✈️</text>
  <text x="90" y="97" font-family="'Inter', sans-serif" font-size="15" fill="#ffffff" font-weight="800">WANDER<tspan fill="#2dd4bf">LUST</tspan></text>
  <text x="90" y="108" font-family="'Inter', sans-serif" font-size="8" fill="#5eead4" letter-spacing="1.5">INTERNATIONAL &amp; DOMESTIC TOURS</text>

  <text x="430" y="97" font-family="'Inter', sans-serif" font-size="11" fill="#ccfbf1">Goa Packages</text>
  <text x="520" y="97" font-family="'Inter', sans-serif" font-size="11" fill="#ccfbf1">Kerala Stays</text>
  <text x="600" y="97" font-family="'Inter', sans-serif" font-size="11" fill="#ccfbf1">Dubai &amp; Bali</text>

  <rect x="670" y="80" width="85" height="26" rx="6" fill="url(#tealGrad)"/>
  <text x="712" y="97" font-family="'Inter', sans-serif" font-size="10" fill="#000000" font-weight="800" text-anchor="middle">Explore</text>

  <!-- Hero Content -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="190" height="22" rx="11" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
    <text x="95" y="15" font-family="'Inter', sans-serif" font-size="9" fill="#a7f3d0" font-weight="700" text-anchor="middle">🌴 BEST TOUR OPERATOR TELANGANA</text>

    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="24" fill="#ffffff" font-weight="900">
      Unforgettable Vacations &amp;
    </text>
    <text x="0" y="76" font-family="'Inter', sans-serif" font-size="24" fill="#2dd4bf" font-weight="900">
      Handcrafted Tour Packages.
    </text>

    <text x="0" y="102" font-family="'Inter', sans-serif" font-size="11" fill="#99f6e4">
      From misty hills of Munnar to white sand beaches of Goa and Maldives.
    </text>
    <text x="0" y="118" font-family="'Inter', sans-serif" font-size="11" fill="#99f6e4">
      Flight bookings, 4-star hotels, daily sightseeing, and Telugu guides.
    </text>

    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="150" height="38" rx="8" fill="url(#tealGrad)"/>
      <text x="75" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#000000" font-weight="800" text-anchor="middle">🗺️ VIEW PACKAGES</text>

      <rect x="160" y="0" width="140" height="38" rx="8" fill="#10b981"/>
      <text x="230" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="800" text-anchor="middle">💬 WHATSAPP EXPERT</text>
    </g>

    <!-- 3 Destination Cards -->
    <g transform="translate(0, 192)">
      <!-- Goa -->
      <rect x="0" y="0" width="105" height="92" rx="8" fill="#0f2928" stroke="#134e4a" stroke-width="1"/>
      <text x="12" y="20" font-size="14">🏖️</text>
      <text x="12" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Goa Delight</text>
      <text x="12" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#5eead4">3 Nights / 4 Days</text>
      <text x="12" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#fde047" font-weight="800">₹8,999/p</text>
      <text x="12" y="82" font-family="'Inter', sans-serif" font-size="8" fill="#a7f3d0">Hotel + Meals</text>

      <!-- Kerala -->
      <rect x="115" y="0" width="105" height="92" rx="8" fill="#0f2928" stroke="#134e4a" stroke-width="1"/>
      <text x="127" y="20" font-size="14">🛶</text>
      <text x="127" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Kerala Mystic</text>
      <text x="127" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#5eead4">Munnar Houseboat</text>
      <text x="127" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#fde047" font-weight="800">₹14,499/p</text>
      <text x="127" y="82" font-family="'Inter', sans-serif" font-size="8" fill="#a7f3d0">Cab Included</text>

      <!-- Dubai -->
      <rect x="230" y="0" width="105" height="92" rx="8" fill="#0f2928" stroke="#134e4a" stroke-width="1"/>
      <text x="242" y="20" font-size="14">🏙️</text>
      <text x="242" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Dubai Mega</text>
      <text x="242" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#5eead4">Desert Safari</text>
      <text x="242" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#fde047" font-weight="800">₹39,999/p</text>
      <text x="242" y="82" font-family="'Inter', sans-serif" font-size="8" fill="#a7f3d0">Visa + Flights</text>
    </g>
  </g>

  <!-- Right Visual: Scenic Banner & Inquiry Card -->
  <g transform="translate(470, 145)">
    <rect x="0" y="0" width="270" height="280" rx="14" fill="#0b2423" stroke="#115e59" stroke-width="1.5"/>
    <!-- Tropical Sun & Waves Illustration -->
    <rect x="15" y="15" width="240" height="135" rx="10" fill="url(#sunsetGrad)"/>
    <circle cx="135" cy="85" r="45" fill="#fef08a" opacity="0.9"/>
    <path d="M15 115 Q75 90 135 115 T255 115 L255 150 L15 150 Z" fill="#042f2e" opacity="0.8"/>
    <path d="M15 130 Q75 110 135 130 T255 130 L255 150 L15 150 Z" fill="#021f1e"/>
    <text x="135" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="800" text-anchor="middle">DISCOVER BREATHTAKING ESCAPES</text>
    
    <!-- Itinerary Card -->
    <rect x="15" y="160" width="240" height="52" rx="8" fill="#042120" stroke="#134e4a" stroke-width="1"/>
    <text x="25" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#2dd4bf" font-weight="700">🌟 Custom Group &amp; Honeymoon Trips</text>
    <text x="25" y="196" font-family="'Inter', sans-serif" font-size="9" fill="#a7f3d0">Hyderabad Airport pickup &amp; 24/7 dedicated trip guide</text>

    <!-- WhatsApp consultation -->
    <g transform="translate(15, 222)">
      <rect x="0" y="0" width="240" height="38" rx="8" fill="#10b981"/>
      <text x="120" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="800" text-anchor="middle">💬 GET CUSTOM TOUR ITINERARY</text>
    </g>
  </g>
</svg>
