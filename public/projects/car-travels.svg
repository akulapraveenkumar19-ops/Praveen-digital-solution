      <text x="12" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Swift Dzire</text>
      <text x="12" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Sedan (4+1 AC)</text>
      <text x="12" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#fbbf24" font-weight="800">₹12/km</text>
      <text x="12" y="82" font-family="'Inter', sans-serif" font-size="8" fill="#22c55e">Airport: ₹999</text>

      <rect x="115" y="0" width="105" height="92" rx="8" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1"/>
