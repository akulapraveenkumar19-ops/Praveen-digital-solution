      <rect x="165" y="0" width="75" height="22" rx="4" fill="#0f172a"/>
      <text x="202" y="15" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" font-weight="600" text-anchor="middle">Airport Drop</text>
    </g>

    <!-- Form Inputs -->
    <g transform="translate(15, 88)">
      <rect x="0" y="0" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">📍 Pickup: Hyderabad / Secunderabad</text>

      <rect x="0" y="36" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="54" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">🏁 Drop: Srisailam / Vijayawada / RGIA</text>

      <rect x="0" y="72" width="240" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="90" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">📅 Date: Tomorrow, 6:00 AM</text>

