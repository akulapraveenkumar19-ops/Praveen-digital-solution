  <text x="575" y="97" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Local Packages</text>

  <rect x="660" y="80" width="95" height="26" rx="6" fill="url(#amberGrad)"/>
  <text x="707" y="97" font-family="'Inter', sans-serif" font-size="10" fill="#000000" font-weight="800" text-anchor="middle">Book Cab</text>

