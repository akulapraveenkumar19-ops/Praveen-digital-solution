      <text x="127" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Innova Crysta</text>
      <text x="127" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">SUV (7+1 AC)</text>
      <text x="127" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#fbbf24" font-weight="800">₹18/km</text>
      <text x="127" y="82" font-family="'Inter', sans-serif" font-size="8" fill="#22c55e">Airport: ₹1,699</text>

      <rect x="230" y="0" width="105" height="92" rx="8" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1"/>
      <text x="242" y="20" font-size="14">🚐</text>
      <text x="242" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Tempo 12-Seater</text>
