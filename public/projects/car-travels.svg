  <text x="92" y="97" font-family="'Inter', sans-serif" font-size="15" fill="#ffffff" font-weight="800">ROYAL <tspan fill="#fbbf24">TRAVELS</tspan></text>
  <text x="92" y="108" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8" letter-spacing="1.5">HYDERABAD CAR RENTALS &amp; TAXI</text>

