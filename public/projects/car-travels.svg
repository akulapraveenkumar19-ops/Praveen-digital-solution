      <text x="120" y="132" font-family="'Inter', sans-serif" font-size="11" fill="#000000" font-weight="800" text-anchor="middle">CHECK AVAILABILITY &amp; BEST RATE</text>
    </g>

    <!-- Trust banner -->
    <rect x="15" y="240" width="240" height="26" rx="6" fill="#0f172a"/>
    <text x="135" y="257" font-family="'Inter', sans-serif" font-size="9" fill="#22c55e" font-weight="600" text-anchor="middle">🛡️ 100% Verified Drivers • Sanitized Fleet</text>
