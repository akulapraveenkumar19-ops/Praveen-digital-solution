  </defs>

  <rect width="800" height="480" fill="url(#taxiBg)"/>

  <!-- Browser Header -->
  <rect x="30" y="25" width="740" height="430" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="25" width="740" height="42" rx="16" fill="#060913"/>
  <circle cx="55" cy="46" r="5.5" fill="#ef4444"/>
  <circle cx="72" cy="46" r="5.5" fill="#f59e0b"/>
  <circle cx="89" cy="46" r="5.5" fill="#10b981"/>
  <rect x="180" y="34" width="440" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="500">🔒 https://royalcars-hyderabadtravels.in</text>

