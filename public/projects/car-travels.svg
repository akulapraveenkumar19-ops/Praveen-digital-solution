    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="24" fill="#ffffff" font-weight="900">
      Affordable Car Rentals &amp;
    </text>
    <text x="0" y="76" font-family="'Inter', sans-serif" font-size="24" fill="#fbbf24" font-weight="900">
      Airport Taxi In Hyderabad.
    </text>

    <text x="0" y="102" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
