<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#070d1e"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="blueGradM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Phone Hardware Frame -->
  <rect x="10" y="10" width="360" height="740" rx="46" fill="url(#phoneBody)" stroke="#475569" stroke-width="3" filter="url(#phoneShadow)"/>
  
  <!-- Outer Bezel Ring -->
  <rect x="15" y="15" width="350" height="730" rx="42" fill="#000000"/>

  <!-- Screen Glass Area -->
  <rect x="22" y="22" width="336" height="716" rx="36" fill="url(#mScreen)"/>

  <!-- Dynamic Island Notch -->
  <rect x="125" y="32" width="130" height="28" rx="14" fill="#000000"/>
  <circle cx="146" cy="46" r="5" fill="#1e293b"/>
  <circle cx="235" cy="46" r="3.5" fill="#0284c7" opacity="0.6"/>

  <!-- Status Bar (9:41, WiFi, 5G, Battery) -->
  <text x="52" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="700">9:41</text>
  <g transform="translate(290, 40)">
    <!-- 5G icon -->
    <text x="0" y="10" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" font-weight="700">5G</text>
    <!-- Battery -->
    <rect x="22" y="0" width="20" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="24" y="2" width="14" height="7" rx="1.5" fill="#10b981"/>
    <rect x="42" y="3" width="2" height="5" rx="1" fill="#ffffff"/>
  </g>

  <!-- Mobile Website Header -->
  <rect x="22" y="68" width="336" height="54" fill="#070f24" stroke="#162347" stroke-width="1"/>
  <!-- Logo -->
  <rect x="36" y="80" width="30" height="30" rx="8" fill="url(#blueGradM)"/>
  <text x="51" y="100" font-family="'Inter', sans-serif" font-size="16" fill="#ffffff" font-weight="900" text-anchor="middle">P</text>
  <text x="74" y="94" font-family="'Inter', sans-serif" font-size="13" fill="#ffffff" font-weight="800">PRAVEEN <tspan fill="#38bdf8">DIGITAL</tspan></text>
  <text x="74" y="104" font-family="'Inter', sans-serif" font-size="8" fill="#64748b">HYDERABAD AGENCY</text>

  <!-- Hamburger Menu Button -->
  <g transform="translate(315, 85)">
    <rect x="0" y="0" width="28" height="24" rx="4" fill="#0f1d40"/>
    <line x1="6" y1="7" x2="22" y2="7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="12" x2="22" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="17" x2="22" y2="17" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Website Mobile Hero Banner -->
  <g transform="translate(36, 136)">
    <!-- Verified Badge -->
    <rect x="0" y="0" width="200" height="20" rx="10" fill="#0c234a" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8" font-weight="700" text-anchor="middle">⚡ 100% MOBILE RESPONSIVE</text>

    <!-- Headline -->
    <text x="0" y="44" font-family="'Inter', sans-serif" font-size="20" fill="#ffffff" font-weight="900" letter-spacing="-0.5">
      Grow Your Business
    </text>
    <text x="0" y="68" font-family="'Inter', sans-serif" font-size="20" fill="#38bdf8" font-weight="900" letter-spacing="-0.5">
      With High-Impact Sites.
    </text>

    <text x="0" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      Websites, Google Business Profile (Maps)
    </text>
    <text x="0" y="106" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      &amp; Google Ads for Hyderabad businesses.
    </text>

    <!-- 1-Click WhatsApp Button (Primary mobile trigger) -->
    <g transform="translate(0, 124)">
      <rect x="0" y="0" width="308" height="42" rx="10" fill="#10b981"/>
      <circle cx="24" cy="21" r="10" fill="#059669"/>
      <text x="24" y="25" font-size="11" fill="#ffffff" text-anchor="middle">💬</text>
      <text x="160" y="26" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="800" text-anchor="middle">WHATSAPP INSTANT CHAT</text>
    </g>

    <!-- 1-Click Direct Call Button -->
    <g transform="translate(0, 174)">
      <rect x="0" y="0" width="308" height="40" rx="10" fill="#0066ff"/>
      <circle cx="24" cy="20" r="10" fill="#0052cc"/>
      <text x="24" y="24" font-size="11" fill="#ffffff" text-anchor="middle">📞</text>
      <text x="160" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="800" text-anchor="middle">CALL +91 95051 64685</text>
    </g>

    <!-- Fast Stats Row -->
    <g transform="translate(0, 226)">
      <rect x="0" y="0" width="96" height="52" rx="8" fill="#0b1739" stroke="#1e2d52" stroke-width="1"/>
      <text x="10" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#22c55e" font-weight="800">99/100</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Mobile Speed</text>

      <rect x="106" y="0" width="96" height="52" rx="8" fill="#0b1739" stroke="#1e2d52" stroke-width="1"/>
      <text x="116" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#38bdf8" font-weight="800">#1 Local</text>
      <text x="116" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Google Maps</text>

      <rect x="212" y="0" width="96" height="52" rx="8" fill="#0b1739" stroke="#1e2d52" stroke-width="1"/>
      <text x="222" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#fbbf24" font-weight="800">5.0 ⭐</text>
      <text x="222" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Client Trust</text>
    </g>

    <!-- Featured Service Cards on Mobile -->
    <g transform="translate(0, 290)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="308" height="60" rx="10" fill="#0c183b" stroke="#1e3260" stroke-width="1"/>
      <rect x="10" y="10" width="40" height="40" rx="8" fill="#0066ff" opacity="0.2"/>
      <text x="30" y="34" font-size="18" text-anchor="middle">🌐</text>
      <text x="60" y="26" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="700">Custom Website Design</text>
      <text x="60" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8">Mobile-First • Fast • Starts ₹5,000</text>
      <text x="290" y="34" font-size="14" fill="#64748b" text-anchor="end">→</text>

      <!-- Card 2 -->
      <rect x="0" y="68" width="308" height="60" rx="10" fill="#0c183b" stroke="#1e3260" stroke-width="1"/>
      <rect x="10" y="78" width="40" height="40" rx="8" fill="#10b981" opacity="0.2"/>
      <text x="30" y="102" font-size="18" text-anchor="middle">📍</text>
      <text x="60" y="94" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="700">Google Business Profile</text>
      <text x="60" y="110" font-family="'Inter', sans-serif" font-size="10" fill="#4ade80">Rank #1 on Google Maps • Starts ₹2,000</text>
      <text x="290" y="102" font-size="14" fill="#64748b" text-anchor="end">→</text>

      <!-- Card 3 -->
      <rect x="0" y="136" width="308" height="60" rx="10" fill="#0c183b" stroke="#1e3260" stroke-width="1"/>
      <rect x="10" y="146" width="40" height="40" rx="8" fill="#f59e0b" opacity="0.2"/>
      <text x="30" y="170" font-size="18" text-anchor="middle">🎯</text>
      <text x="60" y="162" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" font-weight="700">Google Ads &amp; Local SEO</text>
      <text x="60" y="178" font-family="'Inter', sans-serif" font-size="10" fill="#fbbf24">Direct Inbound Calls • High ROI</text>
      <text x="290" y="170" font-size="14" fill="#64748b" text-anchor="end">→</text>
    </g>
  </g>

  <!-- Sticky Bottom Navigation Bar on Mobile -->
  <rect x="22" y="660" width="336" height="58" fill="#060c1d" stroke="#162347" stroke-width="1"/>
  <g transform="translate(42, 668)">
    <text x="20" y="20" font-size="14" text-anchor="middle">🏠</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8" font-weight="700" text-anchor="middle">Home</text>
  </g>
  <g transform="translate(122, 668)">
    <text x="20" y="20" font-size="14" text-anchor="middle">💼</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Projects</text>
  </g>
  <g transform="translate(202, 668)">
    <text x="20" y="20" font-size="14" text-anchor="middle">⚙️</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Services</text>
  </g>
  <g transform="translate(282, 668)">
    <text x="20" y="20" font-size="14" text-anchor="middle">💬</text>
    <text x="20" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#10b981" font-weight="700" text-anchor="middle">Contact</text>
  </g>

  <!-- Bottom Home Bar / Indicator -->
  <rect x="125" y="726" width="130" height="4" rx="2" fill="#64748b"/>
</svg>
