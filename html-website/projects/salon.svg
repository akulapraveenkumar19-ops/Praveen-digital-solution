<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="salonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160d1f"/>
      <stop offset="50%" stop-color="#24112e"/>
      <stop offset="100%" stop-color="#0d0814"/>
    </linearGradient>
    <linearGradient id="pinkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1026" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#salonBg)"/>

  <!-- Browser Header -->
  <rect x="30" y="25" width="740" height="430" rx="16" fill="#130b1c" stroke="#4c1d6b" stroke-width="1.5"/>
  <rect x="30" y="25" width="740" height="42" rx="16" fill="#0b0610"/>
  <circle cx="55" cy="46" r="5.5" fill="#ef4444"/>
  <circle cx="72" cy="46" r="5.5" fill="#f59e0b"/>
  <circle cx="89" cy="46" r="5.5" fill="#10b981"/>
  <rect x="180" y="34" width="440" height="24" rx="6" fill="#1f112b" stroke="#3b1d4a" stroke-width="1"/>
  <text x="400" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#d8b4fe" text-anchor="middle" font-weight="500">🔒 https://glowtonefamilysalon.com</text>

  <!-- Website Navbar -->
  <rect x="30" y="67" width="740" height="52" fill="#1b0e26" stroke="#2d133f" stroke-width="1"/>
  <!-- Salon Logo -->
  <circle cx="65" cy="93" r="15" fill="url(#pinkGold)"/>
  <text x="65" y="98" font-family="'Playfair Display', serif" font-size="14" fill="#ffffff" font-weight="900" text-anchor="middle">G</text>
  <text x="90" y="97" font-family="'Inter', sans-serif" font-size="15" fill="#ffffff" font-weight="800">GLOW <tspan fill="#f472b6">TONE</tspan></text>
  <text x="90" y="108" font-family="'Inter', sans-serif" font-size="8" fill="#e9d5ff" letter-spacing="2">LUXURY FAMILY SALON &amp; SPA</text>

  <text x="420" y="97" font-family="'Inter', sans-serif" font-size="11" fill="#f3e8ff">Hair Styling</text>
  <text x="500" y="97" font-family="'Inter', sans-serif" font-size="11" fill="#f3e8ff">Bridal Makeover</text>
  <text x="600" y="97" font-family="'Inter', sans-serif" font-size="11" fill="#f3e8ff">Skin &amp; Spa</text>

  <rect x="670" y="80" width="85" height="26" rx="13" fill="url(#pinkGold)"/>
  <text x="712" y="97" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Book Slot</text>

  <!-- Hero Content -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#4c0519" stroke="#be185d" stroke-width="1"/>
    <text x="90" y="15" font-family="'Inter', sans-serif" font-size="9" fill="#fbcfe8" font-weight="700" text-anchor="middle">✨ PREMIER SALON IN HYDERABAD</text>

    <text x="0" y="48" font-family="'Playfair Display', serif" font-size="25" fill="#ffffff" font-weight="800">
      Elevate Your Beauty &amp;
    </text>
    <text x="0" y="78" font-family="'Playfair Display', serif" font-size="25" fill="url(#goldText)" font-weight="800">
      Bridal Confidence.
    </text>

    <text x="0" y="104" font-family="'Inter', sans-serif" font-size="11" fill="#e9d5ff">
      Expert stylists, organic skin therapies, keratin treatments,
    </text>
    <text x="0" y="120" font-family="'Inter', sans-serif" font-size="11" fill="#e9d5ff">
      and VIP bridal packages designed for your special day.
    </text>

    <g transform="translate(0, 138)">
