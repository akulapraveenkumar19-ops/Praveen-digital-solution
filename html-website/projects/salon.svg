    <circle cx="70" cy="75" r="35" fill="#3b1d4a" stroke="#ec4899" stroke-width="2"/>
    <circle cx="170" cy="75" r="35" fill="#3b1d4a" stroke="#f59e0b" stroke-width="2"/>
    <path d="M55 75 Q70 50 85 75 T115 75" fill="none" stroke="#fbcfe8" stroke-width="2"/>
    <text x="120" y="130" font-family="'Inter', sans-serif" font-size="10" fill="#f472b6" font-weight="700" text-anchor="middle">MODERN SALON SUITE</text>
    
    <!-- Client Review Pill inside website -->
    <rect x="15" y="175" width="240" height="42" rx="8" fill="#130b1c" stroke="#3b1d4a" stroke-width="1"/>
    <text x="25" y="193" font-family="'Inter', sans-serif" font-size="10" fill="#fde047">⭐⭐⭐⭐⭐ 4.9 on Google (350+ Reviews)</text>
    <text x="25" y="207" font-family="'Inter', sans-serif" font-size="9" fill="#d8b4fe">"Best bridal styling &amp; hair treatment in Hyderabad!"</text>

    <!-- Address & Timings -->
    <rect x="15" y="225" width="240" height="42" rx="8" fill="#130b1c" stroke="#3b1d4a" stroke-width="1"/>
    <text x="25" y="242" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" font-weight="600">📍 Madhapur &amp; Banjara Hills Branches</text>
    <text x="25" y="256" font-family="'Inter', sans-serif" font-size="9" fill="#a855f7">Open Mon-Sun: 9:30 AM – 9:00 PM</text>
  </g>
</svg>
