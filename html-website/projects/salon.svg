      <text x="75" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="800" text-anchor="middle">📅 BOOK APPOINTMENT</text>

      <rect x="160" y="0" width="140" height="38" rx="8" fill="#10b981"/>
      <text x="230" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="800" text-anchor="middle">💬 WHATSAPP MENU</text>
    </g>

    <!-- 3 Service Feature Cards inside -->
    <g transform="translate(0, 195)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="105" height="90" rx="8" fill="url(#cardGrad2)" stroke="#701a75" stroke-width="1"/>
      <text x="12" y="22" font-size="16">✂️</text>
      <text x="12" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Hair Botox</text>
      <text x="12" y="58" font-family="'Inter', sans-serif" font-size="9" fill="#f472b6">&amp; Smoothening</text>
      <text x="12" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#fde047" font-weight="800">From ₹2,499</text>

      <!-- Card 2 -->
      <rect x="115" y="0" width="105" height="90" rx="8" fill="url(#cardGrad2)" stroke="#701a75" stroke-width="1"/>
      <text x="127" y="22" font-size="16">💄</text>
      <text x="127" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Bridal HD</text>
      <text x="127" y="58" font-family="'Inter', sans-serif" font-size="9" fill="#f472b6">Makeover VIP</text>
      <text x="127" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#fde047" font-weight="800">From ₹7,999</text>

      <!-- Card 3 -->
      <rect x="230" y="0" width="105" height="90" rx="8" fill="url(#cardGrad2)" stroke="#701a75" stroke-width="1"/>
      <text x="242" y="22" font-size="16">✨</text>
      <text x="242" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="700">Hydra Glow</text>
      <text x="242" y="58" font-family="'Inter', sans-serif" font-size="9" fill="#f472b6">Korean Facial</text>
      <text x="242" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#fde047" font-weight="800">From ₹1,999</text>
