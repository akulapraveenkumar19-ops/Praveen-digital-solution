  <!-- Right Visual Showcase / Photo Mockup -->
  <g transform="translate(470, 145)">
    <rect x="0" y="0" width="270" height="280" rx="14" fill="#1f112b" stroke="#701a75" stroke-width="1.5"/>
    
    <!-- Salon Interior & Styling Illustration Banner -->
    <rect x="15" y="15" width="240" height="150" rx="10" fill="#2d153d"/>
