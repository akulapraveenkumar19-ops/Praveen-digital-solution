  <!-- Right Visual: Food Presentation Card -->
  <g transform="translate(470, 145)">
    <rect x="0" y="0" width="270" height="280" rx="14" fill="#241408" stroke="#431407" stroke-width="1.5"/>
    <!-- Food bowl graphic -->
    <rect x="15" y="15" width="240" height="135" rx="10" fill="#381b0a"/>
    <ellipse cx="135" cy="85" rx="65" ry="35" fill="#f97316" opacity="0.85"/>
    <ellipse cx="135" cy="80" rx="55" ry="25" fill="#ea580c"/>
    <circle cx="120" cy="78" r="8" fill="#fde047"/>
    <circle cx="150" cy="82" r="6" fill="#fde047"/>
    <text x="135" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#ffedd5" font-weight="800" text-anchor="middle">FRESH CULINARY EXCELLENCE</text>

    <!-- Table reservation card -->
    <rect x="15" y="160" width="240" height="50" rx="8" fill="#140b04" stroke="#431407" stroke-width="1"/>
    <text x="25" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#f97316" font-weight="700">🍽️ Family AC Dining &amp; Rooftop Cafe</text>
    <text x="25" y="196" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">Banjara Hills Rd No. 12 • Valet Parking Available</text>

    <!-- WhatsApp Quick Order -->
    <g transform="translate(15, 220)">
      <rect x="0" y="0" width="240" height="38" rx="8" fill="#10b981"/>
      <text x="120" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="800" text-anchor="middle">💬 ORDER VIA WHATSAPP (15% OFF)</text>
    </g>
  </g>
</svg>
