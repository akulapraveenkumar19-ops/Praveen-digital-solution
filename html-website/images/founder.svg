<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#d49b78"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Circle Frame with gradient border -->
  <circle cx="200" cy="200" r="190" fill="#070d1e" stroke="url(#avatarBg)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="176" fill="#0c1736"/>

  <!-- Subtle tech circles in background -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="200" cy="200" r="105" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.4"/>

  <!-- Character / Executive Silhouette & Features -->
  <!-- Suit Shoulders -->
  <path d="M70 380 C80 290 140 260 200 260 C260 260 320 290 330 380 Z" fill="url(#suit)"/>
  
  <!-- White Shirt Collar & Tie -->
  <polygon points="180,260 220,260 210,310 190,310" fill="#ffffff"/>
  <polygon points="194,275 206,275 203,340 197,340" fill="#0284c7"/>
  <!-- Suit Lapels -->
  <polygon points="150,265 185,330 170,380 120,380" fill="#1e293b"/>
  <polygon points="250,265 215,330 230,380 280,380" fill="#1e293b"/>

  <!-- Neck -->
  <rect x="180" y="215" width="40" height="50" rx="8" fill="url(#skin)"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="60" ry="72" fill="url(#skin)"/>

  <!-- Modern Hair -->
  <path d="M135 170 C130 110 170 85 200 85 C240 85 270 110 265 170 C250 120 220 105 180 110 C155 115 140 140 135 170 Z" fill="#1a1412"/>
  <!-- Sideburns -->
  <rect x="138" y="160" width="10" height="25" rx="3" fill="#1a1412"/>
  <rect x="252" y="160" width="10" height="25" rx="3" fill="#1a1412"/>

  <!-- Ears -->
  <ellipse cx="137" cy="185" rx="8" ry="14" fill="url(#skin)"/>
  <ellipse cx="263" cy="185" rx="8" ry="14" fill="url(#skin)"/>

  <!-- Eyebrows -->
  <path d="M155 160 Q170 155 185 162" fill="none" stroke="#1a1412" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M215 162 Q230 155 245 160" fill="none" stroke="#1a1412" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="170" cy="176" rx="6" ry="4" fill="#1a1412"/>
  <circle cx="172" cy="174" r="1.5" fill="#ffffff"/>
  <ellipse cx="230" cy="176" rx="6" ry="4" fill="#1a1412"/>
  <circle cx="232" cy="174" r="1.5" fill="#ffffff"/>

  <!-- Sleek Modern Glasses -->
  <rect x="150" y="165" width="40" height="24" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="210" y="165" width="40" height="24" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="190" y1="174" x2="210" y2="174" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="140" y1="172" x2="150" y2="172" stroke="#38bdf8" stroke-width="2"/>
  <line x1="250" y1="172" x2="260" y2="172" stroke="#38bdf8" stroke-width="2"/>

  <!-- Nose -->
  <path d="M198 178 L194 200 L204 200" fill="none" stroke="#c07d57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confident Smile & Trimmed Beard -->
  <path d="M185 218 Q200 230 215 218" fill="none" stroke="#a35f3b" stroke-width="3" stroke-linecap="round"/>
  <path d="M165 195 Q200 255 235 195" fill="none" stroke="#2a1f1b" stroke-width="2" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Verified Badge on bottom right -->
  <g transform="translate(270, 270)">
    <circle cx="25" cy="25" r="25" fill="#070d1e" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="25" cy="25" r="20" fill="url(#badgeGlow)"/>
    <path d="M17 25 L22 30 L33 19" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code Symbol Floating Tag on top left -->
  <g transform="translate(25, 60)">
    <rect x="0" y="0" width="90" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <text x="45" y="19" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="middle">&lt;DEV /&gt;</text>
  </g>
</svg>
